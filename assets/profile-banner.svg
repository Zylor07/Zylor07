<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Pritam Chakraborty — Developer Profile</title>
  <desc id="desc">A dark minimal banner with a subtle grid, an abstract orbital illustration, and text describing computer science, AI, computer vision, and backend engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#101d2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="330" rx="22" fill="url(#grid)"/>
  <circle cx="1100" cy="166" r="124" fill="#0ea5e9" opacity="0.07"/>
  <circle cx="1100" cy="166" r="90" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5"/>
  <ellipse cx="1100" cy="166" rx="126" ry="48" transform="rotate(-32 1100 166)" fill="none" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="1.5"/>
  <ellipse cx="1100" cy="166" rx="126" ry="48" transform="rotate(48 1100 166)" fill="none" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1100" cy="166" r="9" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="1006" cy="113" r="5" fill="#67e8f9"/>
  <circle cx="1192" cy="205" r="5" fill="#a78bfa"/>
  <circle cx="1122" cy="42" r="4" fill="#93c5fd"/>
  <path d="M72 72H132" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="72" y="145" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="47" font-weight="750" letter-spacing="1.2">PRITAM CHAKRABORTY</text>
  <text x="75" y="190" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="500" letter-spacing="2.5">COMPUTER SCIENCE · AI / ML · COMPUTER VISION</text>
  <text x="75" y="238" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" letter-spacing="0.8">Building useful things. Learning how they work.</text>
  <text x="75" y="292" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5">ZYLOR07  /  ENGINEERING NOTES</text>
  <rect x="72" y="312" width="1136" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>
</svg>
